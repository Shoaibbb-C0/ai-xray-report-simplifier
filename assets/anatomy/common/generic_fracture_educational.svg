<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" role="img" aria-label="Educational anatomical illustration demonstrating the general medical concept of a bone fracture using a generic bone model">
  <title>Educational Generic Fracture Concept (Example Illustration)</title>
  <desc>Schematic diagram displaying normal bone structure versus a simulated break across a generic long bone. This is an educational example and does NOT represent an individual patient's injury location.</desc>
  <defs>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Badges -->
  <g transform="translate(16, 20)">
    <rect width="180" height="26" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" />
    <text x="90" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Educational Concept Only</text>
  </g>

  <g transform="translate(230, 20)">
    <rect width="154" height="26" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" />
    <text x="77" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">Example Break Concept</text>
  </g>

  <!-- Generic Bone with Break in Diaphysis -->
  <g id="broken-bone" filter="url(#subtleShadow)">
    <!-- Upper half -->
    <path d="M 160 80 C 140 60 180 50 200 65 C 220 50 260 60 240 80 C 225 95 220 120 220 160 L 220 188 L 198 194 L 180 184 L 180 160 C 180 120 175 95 160 80 Z" fill="url(#boneGrad)" stroke="#475569" stroke-width="2.5" />

    <!-- Lower half -->
    <path d="M 180 212 L 198 202 L 220 208 L 220 240 C 220 280 225 305 240 320 C 260 340 220 350 200 335 C 180 350 140 340 160 320 C 175 305 180 280 180 240 Z" fill="url(#boneGrad)" stroke="#475569" stroke-width="2.5" />
  </g>

  <!-- Simulated Fracture Highlight -->
  <g id="fracture-highlight">
    <path d="M 175 190 L 192 201 L 205 195 L 225 204" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="199" cy="199" r="20" fill="#ef4444" fill-opacity="0.18" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2" />

    <!-- Educational Callout Box -->
    <g transform="translate(14, 250)">
      <rect width="138" height="48" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4" filter="url(#subtleShadow)" />
      <text x="69" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Example illustration</text>
      <text x="69" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">(Generic break concept)</text>
      <text x="69" y="43" font-family="system-ui, sans-serif" font-size="8" font-style="italic" fill="#dc2626" text-anchor="middle">NOT patient's X-ray location</text>
      <!-- Pointer line -->
      <line x1="138" y1="24" x2="182" y2="201" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3" />
      <circle cx="182" cy="201" r="3" fill="#dc2626" />
    </g>
  </g>

  <!-- Bottom Educational Notice -->
  <text x="200" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#dc2626" font-weight="600" text-anchor="middle">Notice: Generic anatomical break diagram • Does not depict your specific injury site</text>
</svg>

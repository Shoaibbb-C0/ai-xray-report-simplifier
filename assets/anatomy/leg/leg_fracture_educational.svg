<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" role="img" aria-label="Educational anatomical illustration demonstrating the general medical concept of a bone fracture using a simulated leg tibia model">
  <title>Educational Leg Fracture Concept (Example Illustration)</title>
  <desc>Schematic diagram displaying normal bone structure versus a simulated break along the mid-tibia. This is a generic educational example and does NOT represent an individual patient's injury location.</desc>
  <defs>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Badges -->
  <g transform="translate(16, 20)">
    <rect width="180" height="26" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" />
    <text x="90" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Educational Concept Only</text>
  </g>

  <g transform="translate(230, 20)">
    <rect width="154" height="26" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" />
    <text x="77" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">Example Break Concept</text>
  </g>

  <!-- Distal Femur -->
  <g id="femur" filter="url(#subtleShadow)">
    <path d="M 175 60 L 225 60 L 225 110 Q 235 125 245 130 L 155 130 Q 165 125 175 110 Z" fill="url(#boneGrad)" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Patella -->
  <ellipse cx="200" cy="142" rx="16" ry="12" fill="url(#boneGrad)" stroke="#475569" stroke-width="1.8" />

  <!-- Lower Leg with Simulated Break in Mid-Tibia -->
  <g id="tibia-with-break" filter="url(#subtleShadow)">
    <!-- Proximal Tibia segment -->
    <path d="M 160 160 Q 155 175 170 185 L 171 236 L 220 242 L 224 185 Q 235 175 235 160 Z" fill="url(#boneGrad)" stroke="#475569" stroke-width="2" />

    <!-- Distal Tibia segment -->
    <path d="M 172 250 L 172 320 Q 165 340 160 355 L 210 355 Q 212 340 216 320 L 219 254 Z" fill="url(#boneGrad)" stroke="#475569" stroke-width="2" />

    <!-- Intact Fibula -->
    <path d="M 245 180 Q 252 190 250 205 L 246 315 Q 248 335 252 355 L 238 355 Q 236 335 236 315 L 238 205 Q 238 190 245 180 Z" fill="url(#boneGrad)" stroke="#475569" stroke-width="1.8" />
  </g>

  <!-- Simulated Fracture Highlight (Example Discontinuity) -->
  <g id="fracture-highlight">
    <path d="M 167 242 L 182 248 L 202 244 L 224 250" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="195" cy="246" r="18" fill="#ef4444" fill-opacity="0.18" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2" />

    <!-- Educational Callout Box -->
    <g transform="translate(14, 224)">
      <rect width="138" height="48" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4" filter="url(#subtleShadow)" />
      <text x="69" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Example illustration</text>
      <text x="69" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">(Generic break concept)</text>
      <text x="69" y="43" font-family="system-ui, sans-serif" font-size="8" font-style="italic" fill="#dc2626" text-anchor="middle">NOT patient's X-ray location</text>
      <!-- Pointer line -->
      <line x1="138" y1="24" x2="175" y2="245" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3" />
      <circle cx="175" cy="245" r="3" fill="#dc2626" />
    </g>
  </g>

  <!-- Bottom Educational Notice -->
  <text x="200" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#dc2626" font-weight="600" text-anchor="middle">Notice: Generic anatomical break diagram • Does not depict your specific injury site</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" role="img" aria-label="Educational anatomical illustration demonstrating the general medical concept of a bone fracture using a simulated shoulder clavicle model">
  <title>Educational Shoulder Fracture Concept (Example Illustration)</title>
  <desc>Schematic diagram displaying normal shoulder girdle alignment versus a simulated discontinuity across the mid-clavicle. This is a generic educational example and does NOT represent an individual patient's injury location.</desc>
  <defs>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Badges -->
  <g transform="translate(16, 20)">
    <rect width="180" height="26" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" />
    <text x="90" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Educational Concept Only</text>
  </g>

  <g transform="translate(230, 20)">
    <rect width="154" height="26" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" />
    <text x="77" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">Example Break Concept</text>
  </g>

  <!-- Clavicle with Simulated Discontinuity in Mid-Shaft -->
  <g id="clavicle-break" filter="url(#subtleShadow)">
    <!-- Medial segment -->
    <path d="M 60 100 Q 110 92 145 96 L 142 114 Q 105 110 60 120 Z" fill="url(#boneGrad)" stroke="#475569" stroke-width="2" />
    <!-- Lateral segment -->
    <path d="M 160 98 Q 210 102 270 115 L 265 130 Q 210 120 157 116 Z" fill="url(#boneGrad)" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Scapula -->
  <g id="scapula" filter="url(#subtleShadow)">
    <path d="M 270 120 L 290 125 Q 300 135 295 150 L 250 170 Q 230 180 210 200 L 190 310 Q 170 280 160 220 Q 150 160 210 145 Z" fill="url(#boneGrad)" stroke="#475569" stroke-width="2" />
    <path d="M 235 160 A 24 24 0 0 1 250 200" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="3,2" />
  </g>

  <!-- Humerus -->
  <g id="humerus" filter="url(#subtleShadow)">
    <circle cx="265" cy="180" r="28" fill="url(#boneGrad)" stroke="#475569" stroke-width="2" />
    <path d="M 245 205 L 230 370 L 275 370 L 285 205 Z" fill="url(#boneGrad)" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Simulated Fracture Highlight (Clavicle Break Line) -->
  <g id="fracture-highlight">
    <path d="M 144 94 L 152 108 L 148 114 L 158 122" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="151" cy="108" r="16" fill="#ef4444" fill-opacity="0.18" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2" />

    <!-- Educational Callout Box -->
    <g transform="translate(70, 140)">
      <rect width="138" height="48" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4" filter="url(#subtleShadow)" />
      <text x="69" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Example illustration</text>
      <text x="69" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">(Generic collarbone break)</text>
      <text x="69" y="43" font-family="system-ui, sans-serif" font-size="8" font-style="italic" fill="#dc2626" text-anchor="middle">NOT patient's X-ray location</text>
      <!-- Pointer line -->
      <line x1="120" y1="0" x2="148" y2="-28" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3" />
      <circle cx="148" cy="-28" r="3" fill="#dc2626" />
    </g>
  </g>

  <!-- Bottom Educational Notice -->
  <text x="200" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#dc2626" font-weight="600" text-anchor="middle">Notice: Generic anatomical break diagram • Does not depict your specific injury site</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" role="img" aria-label="Illustration indicating that model confidence is uncertain and requires clinical evaluation">
  <title>Uncertain Classification (Inconclusive Radiograph)</title>
  <desc>A schematic showing an amber inspection magnifying glass over an X-ray film with a question badge indicating the model cannot make a confident classification.</desc>
  <defs>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Top Badge -->
  <g transform="translate(110, 24)">
    <rect width="180" height="28" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" />
    <text x="90" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Low Confidence State</text>
  </g>

  <!-- Film Frame with Magnifying Glass & Question Mark -->
  <g id="illustration" transform="translate(100, 80)" filter="url(#subtleShadow)">
    <rect width="200" height="180" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- Simulated faint bone outline inside film -->
    <path d="M 80 40 Q 95 30 110 40 L 110 140 Q 95 150 80 140 Z" fill="#475569" opacity="0.4" />

    <!-- Amber Magnifying Glass -->
    <circle cx="100" cy="85" r="46" fill="#fef3c7" fill-opacity="0.3" stroke="#f59e0b" stroke-width="4" />
    <line x1="132" y1="117" x2="165" y2="150" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />

    <!-- Question Mark -->
    <text x="100" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#f59e0b" text-anchor="middle">?</text>
  </g>

  <!-- Explanation Text -->
  <g transform="translate(200, 295)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Inconclusive Classification</text>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">The model could not make a confident determination.</text>
    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">A clinician must review the radiograph directly.</text>
  </g>

  <text x="200" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Safety Protocol • Unconfident Predictions Routed for Review</text>
</svg>

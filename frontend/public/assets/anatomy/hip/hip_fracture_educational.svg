<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" role="img" aria-label="Educational anatomical illustration demonstrating the general medical concept of a bone fracture using a simulated hip femoral neck model">
  <title>Educational Hip Fracture Concept (Example Illustration)</title>
  <desc>Schematic diagram displaying normal pelvic bone alignment versus a simulated discontinuity across the femoral neck. This is a generic educational example and does NOT represent an individual patient's injury location.</desc>
  <defs>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Badges -->
  <g transform="translate(16, 20)">
    <rect width="180" height="26" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" />
    <text x="90" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Educational Concept Only</text>
  </g>

  <g transform="translate(230, 20)">
    <rect width="154" height="26" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" />
    <text x="77" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">Example Break Concept</text>
  </g>

  <!-- Pelvis -->
  <g id="pelvis" filter="url(#subtleShadow)">
    <path d="M 60 70 Q 150 50 240 90 Q 280 115 285 160 Q 260 170 230 185 Q 200 200 190 240 Q 160 210 130 200 Q 90 200 65 170 Z" fill="url(#boneGrad)" stroke="#475569" stroke-width="2" />
    <path d="M 210 160 A 38 38 0 0 1 270 215" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="3,2" />
  </g>

  <!-- Femur with Simulated Neck Discontinuity -->
  <g id="femur" filter="url(#subtleShadow)">
    <!-- Femoral Head -->
    <circle cx="238" cy="192" r="30" fill="url(#boneGrad)" stroke="#475569" stroke-width="2" />

    <!-- Femoral Shaft & Trochanter -->
    <path d="M 210 238 L 195 250 Q 185 252 175 260 L 180 370 L 225 370 L 225 285 Q 240 270 245 250 L 235 240 Z" fill="url(#boneGrad)" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Simulated Fracture Highlight (Femoral Neck Line) -->
  <g id="fracture-highlight">
    <path d="M 214 218 L 228 232 L 236 226 L 250 238" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="232" cy="228" r="18" fill="#ef4444" fill-opacity="0.18" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2" />

    <!-- Educational Callout Box -->
    <g transform="translate(14, 280)">
      <rect width="138" height="48" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4" filter="url(#subtleShadow)" />
      <text x="69" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Example illustration</text>
      <text x="69" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">(Generic neck break)</text>
      <text x="69" y="43" font-family="system-ui, sans-serif" font-size="8" font-style="italic" fill="#dc2626" text-anchor="middle">NOT patient's X-ray location</text>
      <!-- Pointer line -->
      <line x1="138" y1="24" x2="216" y2="230" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3" />
      <circle cx="216" cy="230" r="3" fill="#dc2626" />
    </g>
  </g>

  <!-- Bottom Educational Notice -->
  <text x="200" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#dc2626" font-weight="600" text-anchor="middle">Notice: Generic anatomical break diagram • Does not depict your specific injury site</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" role="img" aria-label="Educational anatomical illustration demonstrating the general medical concept of a bone fracture using a simulated hand model">
  <title>Educational Hand Fracture Concept (Example Illustration)</title>
  <desc>Schematic diagram illustrating normal bone structure versus a generic break/discontinuity on a metacarpal bone. This is a generic educational example and does NOT represent an individual patient's injury location.</desc>
  <defs>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Top Badges -->
  <g transform="translate(16, 20)">
    <rect width="180" height="26" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" />
    <text x="90" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Educational Concept Only</text>
  </g>

  <g transform="translate(230, 20)">
    <rect width="154" height="26" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" />
    <text x="77" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">Example Break Concept</text>
  </g>

  <!-- Forearm: Radius & Ulna -->
  <g id="forearm" filter="url(#subtleShadow)">
    <path d="M 150 380 L 150 300 Q 155 285 165 280 L 175 280 Q 185 285 185 300 L 185 380 Z" fill="url(#boneGrad)" stroke="#475569" stroke-width="2" />
    <path d="M 215 380 L 215 305 Q 220 290 230 285 L 238 285 Q 245 290 245 305 L 245 380 Z" fill="url(#boneGrad)" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Carpal Bones -->
  <g id="carpals" filter="url(#subtleShadow)">
    <rect x="162" y="255" width="22" height="18" rx="5" fill="url(#boneGrad)" stroke="#475569" stroke-width="1.8" />
    <rect x="188" y="255" width="22" height="18" rx="5" fill="url(#boneGrad)" stroke="#475569" stroke-width="1.8" />
    <rect x="214" y="255" width="22" height="18" rx="5" fill="url(#boneGrad)" stroke="#475569" stroke-width="1.8" />
    <rect x="156" y="233" width="20" height="18" rx="5" fill="url(#boneGrad)" stroke="#475569" stroke-width="1.8" />
    <rect x="180" y="233" width="20" height="18" rx="5" fill="url(#boneGrad)" stroke="#475569" stroke-width="1.8" />
    <rect x="204" y="233" width="20" height="18" rx="5" fill="url(#boneGrad)" stroke="#475569" stroke-width="1.8" />
    <rect x="228" y="233" width="18" height="18" rx="5" fill="url(#boneGrad)" stroke="#475569" stroke-width="1.8" />
  </g>

  <!-- Metacarpals (With Simulated Break Callout on 3rd Metacarpal) -->
  <g id="metacarpals" stroke="#475569" stroke-width="2" fill="url(#boneGrad)" filter="url(#subtleShadow)">
    <!-- Thumb (1st) -->
    <path d="M 148 240 Q 130 220 120 195 Q 125 185 135 188 Q 150 210 162 230 Z" />
    <!-- Index (2nd) -->
    <rect x="160" y="170" width="16" height="58" rx="6" />
    <!-- Middle (3rd) — Separated by Break Line -->
    <path d="M 188 160 L 206 160 L 206 186 L 196 190 L 188 184 Z" rx="3" />
    <path d="M 188 196 L 198 193 L 206 198 L 206 228 L 188 228 Z" rx="3" />
    <!-- Ring (4th) -->
    <rect x="218" y="170" width="16" height="58" rx="6" />
    <!-- Little (5th) -->
    <rect x="244" y="180" width="14" height="48" rx="6" />
  </g>

  <!-- Simulated Fracture Highlight (Example Discontinuity) -->
  <g id="fracture-highlight">
    <!-- Lightning break line -->
    <path d="M 184 186 L 197 191 L 203 189 L 210 195" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="197" cy="191" r="14" fill="#ef4444" fill-opacity="0.18" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2" />

    <!-- Educational Callout Box -->
    <g transform="translate(14, 180)">
      <rect width="138" height="48" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4" filter="url(#subtleShadow)" />
      <text x="69" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Example illustration</text>
      <text x="69" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">(Generic break concept)</text>
      <text x="69" y="43" font-family="system-ui, sans-serif" font-size="8" font-style="italic" fill="#dc2626" text-anchor="middle">NOT patient's X-ray location</text>
      <!-- Pointer line -->
      <line x1="138" y1="24" x2="182" y2="191" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3" />
      <circle cx="182" cy="191" r="3" fill="#dc2626" />
    </g>
  </g>

  <!-- Phalanges -->
  <g id="phalanges" stroke="#475569" stroke-width="1.8" fill="url(#boneGrad)">
    <rect x="105" y="160" width="14" height="24" rx="4" transform="rotate(-30 112 172)" />
    <rect x="88" y="132" width="13" height="20" rx="4" transform="rotate(-35 94 142)" />
    <rect x="161" y="138" width="14" height="26" rx="4" />
    <rect x="162" y="112" width="12" height="22" rx="4" />
    <rect x="163" y="90" width="10" height="18" rx="4" />
    <rect x="190" y="126" width="14" height="28" rx="4" />
    <rect x="191" y="98" width="12" height="24" rx="4" />
    <rect x="192" y="74" width="10" height="20" rx="4" />
    <rect x="219" y="138" width="14" height="26" rx="4" />
    <rect x="220" y="112" width="12" height="22" rx="4" />
    <rect x="221" y="90" width="10" height="18" rx="4" />
    <rect x="245" y="150" width="12" height="24" rx="4" />
    <rect x="246" y="128" width="10" height="18" rx="4" />
    <rect x="247" y="110" width="9" height="15" rx="4" />
  </g>

  <!-- Bottom Educational Notice -->
  <text x="200" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#dc2626" font-weight="600" text-anchor="middle">Notice: Generic anatomical break diagram • Does not depict your specific injury site</text>
</svg>
